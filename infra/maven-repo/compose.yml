# A local Maven repository for the TechEazyHQ libraries (docs/distribution.md). Reposilite is small (about 100 MB of
# memory) and keeps its data in a Docker volume. Dev-only: it listens on localhost over plain HTTP, so never expose it.
#
#   docker compose -f infra/maven-repo/compose.yml up -d
#   TECHEAZY_REPO_PASSWORD=<the password> ./gradlew publish
#
# Repositories: http://localhost:8083/releases and http://localhost:8083/snapshots (anyone on this machine can read;
# publishing needs the admin token below).
name: techeazy-maven-repo

services:
  reposilite:
    image: dzikoysk/reposilite:3.5.19
    container_name: techeazy-maven-repo
    restart: unless-stopped
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      JAVA_OPTS: "-Xmx256m"
      # Creates the access token "admin" with this secret on every start (the image reads its arguments from this
      # variable). Set your own: export TECHEAZY_REPO_PASSWORD=...
      REPOSILITE_OPTS: "--token admin:${TECHEAZY_REPO_PASSWORD:?set TECHEAZY_REPO_PASSWORD to the admin token secret}"
    volumes:
      - repo-data:/app/data
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m

volumes:
  repo-data:
