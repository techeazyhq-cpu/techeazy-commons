# The API standards every product's OpenAPI documents follow, as a Spectral ruleset. A product extends it from its own ruleset:
#
#   extends: ["../../../../../techeazy-commons/tools/contract/spectral-base.yaml"]
#
# and adds what is its own (its data-class tag on every property, its purpose-of-use header). Errors are RFC 9457 problems
# (the error dictionary), every operation is secured and named, and nothing is served in the clear.
extends: ["spectral:oas"]

rules:
  # ---- names -----------------------------------------------------------------------------------------------------------------
  operation-operationId: error
  operation-tags: error
  operation-description: warn
  info-description: error
  info-contact: off

  contract-paths-are-lower-case-words:
    description: Paths are lower-case words with dashes, ids in braces, no trailing slash.
    severity: error
    given: "$.paths[*]~"
    then:
      function: pattern
      functionOptions:
        match: "^(/[a-z0-9-]+|/\\{[a-zA-Z0-9]+\\})+$"

  contract-operation-ids-are-camel-case:
    description: operationId is lower camel case, so generated clients read naturally.
    severity: error
    given: "$.paths[*][get,put,post,delete,patch].operationId"
    then:
      function: pattern
      functionOptions:
        match: "^[a-z][a-zA-Z0-9]*$"

  # ---- security --------------------------------------------------------------------------------------------------------------
  contract-servers-use-https:
    description: Every server is https; the platform has no cleartext listener.
    severity: error
    given: "$.servers[*].url"
    then:
      function: pattern
      functionOptions:
        match: "^https://"

  contract-operations-are-secured:
    description: Every operation declares its security (on the operation or for the whole document).
    severity: error
    given: "$"
    then:
      function: schema
      functionOptions:
        schema:
          type: object
          required: [security]
          properties:
            security:
              type: array
              minItems: 1

  contract-secured-operations-say-401:
    description: A secured operation documents the 401 it answers when nobody is signed in.
    severity: error
    given: "$.paths[*][get,put,post,delete,patch].responses"
    then:
      field: "401"
      function: truthy

  contract-secured-operations-say-403:
    description: A secured operation documents the 403 it answers when the caller is not allowed.
    severity: error
    given: "$.paths[*][get,put,post,delete,patch].responses"
    then:
      field: "403"
      function: truthy

  # ---- errors ----------------------------------------------------------------------------------------------------------------
  contract-errors-are-problems:
    description: Every 4xx and 5xx answer is application/problem+json (RFC 9457), as the error dictionary defines.
    severity: error
    given: "$.paths[*][get,put,post,delete,patch].responses[?(@property.match(/^[45]/))]"
    then:
      field: "content.application/problem+json"
      function: truthy

  contract-success-has-a-schema:
    description: A JSON success answer says what it holds.
    severity: error
    given: "$.paths[*][get,put,post,delete,patch].responses[?(@property.match(/^2/))].content.application/json"
    then:
      field: schema
      function: truthy
